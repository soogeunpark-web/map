<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>용산존 OD 경로 (픽업↔배송)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:'Malgun Gothic',system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;top:12px;right:12px;z-index:1000;background:rgba(255,255,255,.97);
    border-radius:12px;padding:14px 16px;box-shadow:0 4px 18px rgba(0,0,0,.2);width:236px}
  .panel h3{margin:0 0 4px;font-size:15px}
  .sub{font-size:11px;color:#999;margin-bottom:10px}
  .grp{margin-bottom:12px}
  .grp .lbl{font-size:12px;color:#555;margin-bottom:6px;font-weight:700}
  .panel label{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:2px 0;cursor:pointer}
  .panel input[type=range]{width:100%}
  .val{color:#0a68ff;font-weight:700}
  .foot{font-size:11px;color:#888;border-top:1px solid #eee;padding-top:8px;margin-top:2px;line-height:1.5}
  .legend{position:absolute;bottom:18px;right:12px;z-index:1000;background:rgba(255,255,255,.97);
    border-radius:10px;padding:10px 12px;box-shadow:0 3px 14px rgba(0,0,0,.18);font-size:12px}
  .legend .bar{height:12px;width:170px;border-radius:3px;
    background:linear-gradient(90deg,#c9ccd1,#ffd27f,#ff8c1a,#e8410f,#8b0000);margin:5px 0 3px}
  .basemap{filter:grayscale(1) brightness(1.12) contrast(0.82)}
  .legend .ticks{display:flex;justify-content:space-between;color:#666}
  .heat-only,.grid-only{display:none}
  .hint{font-size:11px;color:#aaa;margin-top:2px}

  /* 드릴다운 왼쪽 패널 */
  #drillPanel{position:absolute;top:12px;left:12px;z-index:1001;
    width:max-content;min-width:300px;max-width:min(640px,94vw);
    max-height:calc(100vh - 104px);display:none;flex-direction:column;
    background:rgba(255,255,255,.98);border-radius:12px;overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.22)}
  #drillHead{padding:11px 13px;border-bottom:1px solid #eee}
  #backBtn{display:inline-block;background:#141414;color:#fff;border-radius:8px;
    padding:6px 11px;font-size:13px;cursor:pointer;margin-bottom:9px}
  #drillSummary{font-size:12.5px;line-height:1.6;color:#333}
  #drillList{overflow-y:auto;padding:4px 0}
  .row{display:grid;grid-template-columns:46px 112px 122px 196px 72px;
    align-items:center;column-gap:9px;padding:6px 12px;cursor:pointer;
    font-size:12px;border-bottom:1px solid #f4f4f4}
  .row:hover{background:#f5f7ff}
  .row.sel{background:#fff2ec;box-shadow:inset 3px 0 0 #e8410f}
  .row.kin{background:#f0f4ff}
  .badge{justify-self:start;font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;color:#fff;text-align:center}
  .badge.f{background:#e8410f}.badge.s{background:#2b6cff}
  .ono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vnm{font-weight:700;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rsn{color:#e8410f;font-family:ui-monospace,Consolas,monospace;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cg{justify-self:start;font-size:10.5px;font-weight:700;color:#fff;border-radius:9px;padding:1px 7px;white-space:nowrap}
</style>
</head>
<body>
<div id="map"></div>

<div id="drillPanel">
  <div id="drillHead">
    <span id="backBtn">← 지도로 돌아가기</span>
    <div id="drillSummary"></div>
  </div>
  <div id="drillList"></div>
</div>

<div class="panel">
  <h3>OD 경로 · 픽업→배송</h3>
  <div class="sub">취소가 어느 픽업→배송 흐름에서 나는지</div>

  <div class="grp">
    <div class="lbl">보기 방식</div>
    <label><input type="radio" name="mode" value="fail" checked> 취소 주문만 경로</label>
    <label><input type="radio" name="mode" value="agg"> 집계 플로우 (묶어서)</label>
    <label><input type="radio" name="mode" value="heat"> 취소율 히트맵</label>
  </div>

  <div class="grp heat-only">
    <div class="lbl">기준 위치</div>
    <label><input type="radio" name="basis" value="pickup" checked> 픽업지 기준</label>
    <label><input type="radio" name="basis" value="delivery"> 배송지 기준</label>
  </div>

  <div class="grp grid-only">
    <div class="lbl">격자 크기 <span class="val" id="szv"></span></div>
    <input type="range" id="sz" min="150" max="600" step="50" value="300">
    <div class="lbl" style="margin-top:8px">최소 주문수 <span class="val" id="mnv"></span></div>
    <input type="range" id="mn" min="2" max="40" step="1" value="8">
    <div class="hint" id="gridHint"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<div class="legend" id="legend">
  <div>취소율 (색)</div>
  <div class="bar"></div>
  <div class="ticks"><span>0%</span><span>10%</span><span>25%</span><span>50%+</span></div>
  <div id="legendSize" style="margin-top:6px;color:#666"></div>
</div>

  MENU_ACCOUNT_SETTINGS:'메뉴/계정 설정',COURIER_ACCIDENT:'배달원 사고',NEVER_DELIVERED:'미배달'};
function reasonKo(c){return c ? (REASON[c]||c) : '';}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var map=L.map('map',{preferCanvas:true,zoomControl:false,
  scrollWheelZoom:false, zoomSnap:0.5, zoomDelta:0.5});   // 기본 휠 줌 끄고 아래에서 직접 제어
L.control.zoom({position:'bottomleft'}).addTo(map);   // 줌 버튼 좌하단 (왼쪽 패널과 안 겹침)

// 휠 1틱 = 정확히 한 단계. 마우스가 1틱에 이벤트를 여러 번 쏴도 쿨다운으로 1회만 처리
var ZOOM_STEP=0.5, WHEEL_COOLDOWN=110, _wheelLock=false;
map.getContainer().addEventListener('wheel',function(e){
  e.preventDefault();
  if(_wheelLock) return;
  _wheelLock=true; setTimeout(function(){_wheelLock=false;}, WHEEL_COOLDOWN);
  var at=map.containerPointToLatLng(map.mouseEventToContainerPoint(e)); // 커서 지점 고정
  map.setZoomAround(at, map.getZoom() + (e.deltaY<0 ? ZOOM_STEP : -ZOOM_STEP));
}, {passive:false});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'&copy; OpenStreetMap contributors',maxZoom:19,className:'basemap'}).addTo(map);

var LAT=[],LNG=[];
for(var i=0;i<DATA.length;i++){LAT.push(DATA[i][0],DATA[i][2]);LNG.push(DATA[i][1],DATA[i][3]);}
var HOME=[[Math.min.apply(null,LAT),Math.min.apply(null,LNG)],[Math.max.apply(null,LAT),Math.max.apply(null,LNG)]];
map.fitBounds(HOME);

var g=L.layerGroup().addTo(map);
var CGPAL=['#7b3fe4','#12a4a4','#c81d77','#2d8f2d','#d98a00','#0071bc','#b23b3b','#5a5a5a'];

function ratioColor(r){
  var s=[[0,[201,204,209]],[0.1,[255,210,127]],[0.25,[255,140,26]],[0.4,[232,65,15]],[0.6,[139,0,0]]];
  if(r>=0.6)return 'rgb(139,0,0)';
  for(var i=1;i<s.length;i++){if(r<=s[i][0]){var a=s[i-1],b=s[i],t=(r-a[0])/(b[0]-a[0]);
    var c=[0,1,2].map(function(k){return Math.round(a[1][k]+(b[1][k]-a[1][k])*t)});
    return 'rgb('+c[0]+','+c[1]+','+c[2]+')';}}
  return 'rgb(139,0,0)';
}
function arc(A,B,curv){
  var mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=B[0]-A[0],dy=B[1]-A[1];
  var cx=mx-dy*curv,cy=my+dx*curv,pts=[],N=16;
  for(var t=0;t<=N;t++){var u=t/N,iu=1-u;
    pts.push([iu*iu*A[0]+2*iu*u*cx+u*u*B[0], iu*iu*A[1]+2*iu*u*cy+u*u*B[1]]);}
  return pts;
}

function renderFail(){
  g.clearLayers();
  var nf=0;
  for(var i=0;i<DATA.length;i++){var d=DATA[i];if(d[4]!==0)continue;nf++;
    var p=arc([d[0],d[1]],[d[2],d[3]],0.12);
    L.polyline(p,{color:'#fff',weight:3.2,opacity:0.5,interactive:false}).addTo(g);
    var line=L.polyline(p,{color:'#e8410f',weight:1.6,opacity:0.7});
    line.bindPopup('<b style="color:#e8410f">취소</b> · '+d[5]+'<br><b>'+esc(d[6]||'(매장명 없음)')+'</b>'+
      (d[7]?'<br>사유: <span style="color:#e8410f">'+esc(reasonKo(d[7]))+'</span>':''));
    line.addTo(g);
    L.circleMarker([d[0],d[1]],{radius:2.5,color:'#111',weight:1,fillColor:'#111',fillOpacity:1,interactive:false}).addTo(g);
    L.circleMarker([d[2],d[3]],{radius:2.5,color:'#e8410f',weight:1.2,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(g);
  }
  document.getElementById('foot').innerHTML='취소 경로 '+nf.toLocaleString()+'개<br>● 픽업 · ○ 배송';
}

// 취소율 히트맵: 격자 집계 → 원(구름). 색=취소율, 크기=주문량
function renderHeat(){
  g.clearLayers();
  var basis=document.querySelector('input[name=basis]:checked').value;
  var meters=+document.getElementById('sz').value, minN=+document.getElementById('mn').value;
  var latDeg=meters/111320, lngDeg=meters/(111320*Math.cos(37.535*Math.PI/180));
  GRID.latDeg=latDeg; GRID.lngDeg=lngDeg;
  var cells={};
  for(var i=0;i<DATA.length;i++){var d=DATA[i];
    var lat=basis==='delivery'?d[2]:d[0], lng=basis==='delivery'?d[3]:d[1];
    var gy=Math.floor(lat/latDeg), gx=Math.floor(lng/lngDeg), k=gy+'_'+gx;
    var c=cells[k]||(cells[k]={gy:gy,gx:gx,n:0,f:0}); c.n++; if(d[4]===0)c.f++;
  }
  var arr=[];for(var k in cells){if(cells[k].n>=minN)arr.push(cells[k]);}
  var maxN=1;for(var i=0;i<arr.length;i++)maxN=Math.max(maxN,arr[i].n);
  arr.sort(function(a,b){return b.n-a.n;});  // 큰 것 먼저(작은 것이 위로 오게)
  var totN=0,totF=0,worst=null;
  for(var k in cells){totN+=cells[k].n;totF+=cells[k].f;}
  for(var i=0;i<arr.length;i++){var c=arr[i], r=c.f/c.n;
    var lat=(c.gy+0.5)*latDeg, lng=(c.gx+0.5)*lngDeg;
    var rad=6+28*Math.sqrt(c.n/maxN);           // 면적∝주문량
    var col=ratioColor(r);
    L.circleMarker([lat,lng],{radius:rad*1.7,stroke:false,fillColor:col,fillOpacity:0.10,interactive:false}).addTo(g); // 구름 헤일로
    var cm=L.circleMarker([lat,lng],{radius:rad,stroke:true,color:'#fff',weight:0.8,fillColor:col,fillOpacity:0.62});
    cm.bindPopup('<b>취소율 '+(r*100).toFixed(1)+'%</b><br>주문 '+c.n+'건 · 취소 '+c.f+'건'+
      '<br><button onclick="drillCell(\''+basis+'\','+c.gy+','+c.gx+')" '+
      'style="margin-top:8px;width:100%;padding:6px 8px;border:0;border-radius:6px;'+
      'background:#e8410f;color:#fff;font-size:13px;font-weight:700;cursor:pointer">자세히 보기 (개별 경로)</button>');
    cm.addTo(g);
    if(!worst||r>worst.f/worst.n||(r===worst.f/worst.n&&c.n>worst.n))worst=c;
  }
  var overall=totN?totF/totN*100:0;
  var msg=(basis==='delivery'?'배송지':'픽업지')+' 기준 · 전체 '+totN.toLocaleString()+'건 · 취소 '+totF.toLocaleString()+'건 (평균 '+overall.toFixed(1)+'%)<br>표시 격자 '+arr.length+'개';
  if(worst)msg+='<br>최고 취소율: '+((worst.f/worst.n)*100).toFixed(0)+'% ('+worst.f+'/'+worst.n+')';
  document.getElementById('foot').innerHTML=msg;
}

var GRID={latDeg:0,lngDeg:0};
function renderAgg(){
  g.clearLayers();
  var meters=+document.getElementById('sz').value, minN=+document.getElementById('mn').value;
  var latDeg=meters/111320, lngDeg=meters/(111320*Math.cos(37.535*Math.PI/180));
  GRID.latDeg=latDeg; GRID.lngDeg=lngDeg;
  var flows={};
  for(var i=0;i<DATA.length;i++){var d=DATA[i];
    var py=Math.floor(d[0]/latDeg),px=Math.floor(d[1]/lngDeg),oy=Math.floor(d[2]/latDeg),ox=Math.floor(d[3]/lngDeg);
    var k=py+'_'+px+'_'+oy+'_'+ox, fl=flows[k]||(flows[k]={py:py,px:px,oy:oy,ox:ox,n:0,f:0});
    fl.n++; if(d[4]===0)fl.f++;
  }
  var arr=[];for(var k in flows){if(flows[k].n>=minN)arr.push(flows[k]);}
  arr.sort(function(a,b){return a.n-b.n;});
  var maxN=1;for(var i=0;i<arr.length;i++)maxN=Math.max(maxN,arr[i].n);
  var worst=null;
  for(var i=0;i<arr.length;i++){var fl=arr[i],r=fl.f/fl.n;
    var A=[(fl.py+0.5)*latDeg,(fl.px+0.5)*lngDeg],B=[(fl.oy+0.5)*latDeg,(fl.ox+0.5)*lngDeg];
    var w=2+7*(fl.n/maxN),apts=arc(A,B,0.15);
    L.polyline(apts,{color:'#fff',weight:w+2.5,opacity:0.55,interactive:false}).addTo(g);
    var line=L.polyline(apts,{color:ratioColor(r),weight:w,opacity:0.92});
    line.bindPopup('<b>취소율 '+(r*100).toFixed(0)+'%</b><br>이 픽업권→배송권 주문 '+fl.n+'건 · 취소 '+fl.f+'건'+
      '<br><button onclick="drill('+fl.py+','+fl.px+','+fl.oy+','+fl.ox+')" '+
      'style="margin-top:8px;width:100%;padding:6px 8px;border:0;border-radius:6px;'+
      'background:#e8410f;color:#fff;font-size:13px;font-weight:700;cursor:pointer">자세히 보기 (개별 경로)</button>');
    line.addTo(g);
    L.circleMarker(A,{radius:3,color:'#111',weight:1,fillColor:'#111',fillOpacity:.9,interactive:false}).addTo(g);
    if(!worst||r>worst.f/worst.n||(r===worst.f/worst.n&&fl.n>worst.n))worst=fl;
  }
  var msg='표시 플로우 '+arr.length+'개 (최소 '+minN+'건)';
  if(worst)msg+='<br>최악 흐름: 취소율 '+((worst.f/worst.n)*100).toFixed(0)+'% ('+worst.f+'/'+worst.n+')';
  document.getElementById('foot').innerHTML=msg;
}

// ---- 드릴다운: 특정 픽업권→배송권 개별 주문 ----
var _items=[];  // {no,isFail,cg,dupNo,line,base}
function styleBase(it){it.line.setStyle({color:it.isFail?'#e8410f':'#2b6cff',weight:2.4,opacity:0.9});}
function highlight(ix){
  for(var i=0;i<_items.length;i++) styleBase(_items[i]);
  var sel=_items[ix];
  sel.line.setStyle({weight:6,opacity:1}); sel.line.bringToFront();
  document.querySelectorAll('#drillList .row').forEach(function(el){
    el.classList.remove('sel','kin');
    var j=+el.dataset.ix;
    if(j===ix) el.classList.add('sel');
    else if(_items[j].cg===sel.cg && sel.dupNo) el.classList.add('kin');  // 같은 좌표 형제
  });
  sel.line.openPopup();   // 줌/위치는 그대로 유지 (fitBounds 제거)
}
// 집계 플로우: 픽업권+배송권 쌍으로 필터
window.drill=function(py,px,oy,ox){
  var ld=GRID.latDeg, gd=GRID.lngDeg, matched=[];
  for(var i=0;i<DATA.length;i++){var d=DATA[i];
    if(Math.floor(d[0]/ld)!==py||Math.floor(d[1]/gd)!==px)continue;
    if(Math.floor(d[2]/ld)!==oy||Math.floor(d[3]/gd)!==ox)continue;
    matched.push(d);
  }
  renderDrill(matched,'pair');
};
// 히트맵: 선택한 기준(픽업/배송) 격자 하나로 필터
window.drillCell=function(basis,gy,gx){
  var ld=GRID.latDeg, gd=GRID.lngDeg, matched=[];
  for(var i=0;i<DATA.length;i++){var d=DATA[i];
    var lat=basis==='delivery'?d[2]:d[0], lng=basis==='delivery'?d[3]:d[1];
    if(Math.floor(lat/ld)===gy && Math.floor(lng/gd)===gx) matched.push(d);
  }
  renderDrill(matched, basis==='delivery'?'in':'out');
};
function renderDrill(matched,dir){
  map.closePopup(); g.clearLayers();
  // 동일 좌표 그룹 계산
  var cgMap={},cgNext=0,cgCount={};
  matched.forEach(function(d){var key=d[0]+','+d[1]+','+d[2]+','+d[3];
    if(!(key in cgMap))cgMap[key]=cgNext++;});
  matched.forEach(function(d){var c=cgMap[d[0]+','+d[1]+','+d[2]+','+d[3]];cgCount[c]=(cgCount[c]||0)+1;});
  var dupSeq={},dupN=0;  // 중복 좌표 그룹에만 번호 부여
  Object.keys(cgCount).forEach(function(c){if(cgCount[c]>1){dupN++;dupSeq[c]=dupN;}});

  _items=[]; var succ=0,fail=0,b=[];
  matched.forEach(function(d){
    var isFail=(d[4]===0); isFail?fail++:succ++;
    var cg=cgMap[d[0]+','+d[1]+','+d[2]+','+d[3]];
    var pts=arc([d[0],d[1]],[d[2],d[3]],0.10); b.push([d[0],d[1]],[d[2],d[3]]);
    L.polyline(pts,{color:'#fff',weight:4,opacity:0.6,interactive:false}).addTo(g);
    var col=isFail?'#e8410f':'#2b6cff';
    var line=L.polyline(pts,{color:col,weight:2.4,opacity:0.9});
    line.bindPopup((isFail?'<b style="color:#e8410f">취소</b>':'<b style="color:#2b6cff">성공</b>')+' · '+d[5]+
      '<br><b>'+esc(d[6]||'(매장명 없음)')+'</b>'+(isFail&&d[7]?'<br>사유: <span style="color:#e8410f">'+esc(reasonKo(d[7]))+'</span>':''),
      {autoPan:false});   // 팝업 열려도 지도 이동 안 함
    line.addTo(g);
    L.circleMarker([d[0],d[1]],{radius:3,color:'#111',weight:1,fillColor:'#111',fillOpacity:1,interactive:false}).addTo(g);
    L.circleMarker([d[2],d[3]],{radius:3,color:col,weight:1.4,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(g);
    _items.push({no:d[5],vnm:d[6],rsn:d[7],isFail:isFail,cg:cg,dupNo:dupSeq[cg]||0,line:line});
  });

  // 정렬: 1) 취소 먼저  2) 취소사유 오름차순  3) 동좌표 오름차순  4) 주문번호
  var order=_items.map(function(_,ix){return ix;});
  order.sort(function(a,c){var A=_items[a],B=_items[c];
    if(A.isFail!==B.isFail)return A.isFail?-1:1;
    var ar=A.rsn||'', br=B.rsn||''; if(ar!==br)return ar<br?-1:1;
    if(A.dupNo!==B.dupNo)return A.dupNo-B.dupNo;
    return A.no<B.no?-1:1;});

  var tot=succ+fail;
  var dirTxt = dir==='in' ? '<span style="color:#0a68ff">◎ 이 배송 구역으로 <b>모여드는</b> 주문 (← 어디서 픽업해 오는지)</span><br>'
             : dir==='out' ? '<span style="color:#0a68ff">◉ 이 픽업 구역에서 <b>나가는</b> 주문 (→ 어디로 배송되는지)</span><br>'
             : '';
  document.getElementById('drillSummary').innerHTML=dirTxt+'<b>개별 경로 · 총 '+tot+'건</b><br>'+
    '<span style="color:#2b6cff">성공 '+succ+'</span> / <span style="color:#e8410f">취소 '+fail+'</span> ('+
    (tot?((fail/tot)*100).toFixed(0):0)+'% 취소)'+(dupN?'<br><span style="color:#888">색 칩 = 동일 좌표 주문</span>':'');

  var html='';
  order.forEach(function(ix){var it=_items[ix];
    var chip = it.dupNo ? '<span class="cg" style="background:'+CGPAL[(it.dupNo-1)%CGPAL.length]+'">동좌표 '+it.dupNo+'</span>' : '<span></span>';
    var rsn = it.isFail && it.rsn ? '<span class="rsn">'+esc(it.rsn)+'</span>' : '<span></span>';
    var vn = it.vnm || '(매장명 없음)';
    if(vn.length>10) vn = vn.slice(0,10)+'…';   // 매장명 10글자 제한
    html+='<div class="row" data-ix="'+ix+'">'+
      '<span class="badge '+(it.isFail?'f':'s')+'">'+(it.isFail?'취소':'성공')+'</span>'+
      '<span class="ono">'+it.no+'</span>'+
      '<span class="vnm">'+esc(vn)+'</span>'+
      rsn + chip +
      '</div>';
  });
  var listEl=document.getElementById('drillList');
  listEl.innerHTML=html;
  listEl.querySelectorAll('.row').forEach(function(el){
    el.addEventListener('click',function(){highlight(+el.dataset.ix);});
  });

  document.getElementById('drillPanel').style.display='flex';
  if(b.length) map.fitBounds(b,{padding:[70,70],maxZoom:17});
};
function exitDrill(){document.getElementById('drillPanel').style.display='none'; _items=[]; render();}
document.getElementById('backBtn').addEventListener('click',exitDrill);
// ESC: 자세히 보기 상태이면 지도로 돌아가기
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && document.getElementById('drillPanel').style.display!=='none') exitDrill();
});

function syncUI(){
  var mode=document.querySelector('input[name=mode]:checked').value;
  var gridOn=(mode==='agg'||mode==='heat');
  document.querySelectorAll('.grid-only').forEach(function(e){e.style.display=gridOn?'block':'none';});
  document.querySelectorAll('.heat-only').forEach(function(e){e.style.display=mode==='heat'?'block':'none';});
  document.getElementById('legend').style.display=gridOn?'block':'none';
  document.getElementById('gridHint').textContent = mode==='agg' ? '선 굵기=주문량, 색=취소율 · 선 클릭→자세히' : '원 크기=주문량, 색=취소율';
  document.getElementById('legendSize').textContent = mode==='agg' ? '선 굵기 = 주문량' : '원 크기 = 주문량';
  document.getElementById('szv').textContent=document.getElementById('sz').value+'m';
  document.getElementById('mnv').textContent=document.getElementById('mn').value+'건';
}
function render(){syncUI();
  document.getElementById('drillPanel').style.display='none';
  var m=document.querySelector('input[name=mode]:checked').value;
  if(m==='fail')renderFail(); else if(m==='heat')renderHeat(); else renderAgg();}

document.querySelectorAll('input[name=mode],input[name=basis]').forEach(function(e){e.addEventListener('change',render);});
document.getElementById('sz').addEventListener('input',render);
document.getElementById('mn').addEventListener('input',render);
render();
</script>
</body>
</html>
